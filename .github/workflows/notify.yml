# CO-25: calls the notify route (class reminders, deadline reminders, update alerts) every 5 minutes.
# GitHub may start scheduled runs a few minutes late; the route allows for that (lib/schedule.ts GRACE).
# Repository secrets: APP_URL (e.g. https://campusos.vercel.app) and CRON_SECRET (same value as on Vercel).
name: Notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

# Never run two at once; the route is safe either way, this just avoids piling up late runs.
concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: POST /api/cron/notify
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi
          : > response.json
          code=$(curl --silent --show-error --max-time 60 --output response.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/cron/notify") || code=000
          cat response.json 2>/dev/null; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::notify returned HTTP $code"
            exit 1
          fi
