<title>CampusOS Board v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: review board. Sticky toolbar; plates grouped by screen; phones 390px, tablet 768px and desktop 1280px frames
   rendered at real size and scaled to fit with CSS zoom. App tokens = docs/design/system.md (v3) 1:1. */
:root {
  --bg:#FFFFFF; --bg-2:#F4F6F5; --ink:#14201F; --muted:#52605E; --line:#E1E6E5; --line-strong:#6B7876;
  --head:#0E5A5B; --on-head:#FFFFFF; --on-head-muted:#C9DEDD; --primary:#0E6D6E; --on-primary:#FFFFFF; --primary-soft:#E6F1F0;
  --mark:#FFD54A; --on-mark:#14201F; --danger:#B3261E; --danger-soft:#FCEBEA;
  --board-bg:#E9ECEB; --board-fg:#14201F; --board-muted:#52605E; --board-card:#F7F8F8; --frame:#1D2928;
  --text: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fig: "Barlow Semi Condensed", "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#0F1716; --bg-2:#141E1D; --ink:#E6EEEC; --muted:#9EAEAB; --line:#24302E; --line-strong:#64736F;
  --head:#0B2E2E; --on-head:#E6EEEC; --on-head-muted:#A8C3C1; --primary:#6CC8C2; --on-primary:#062020; --primary-soft:#15302E;
  --mark:#F2C94C; --on-mark:#14201F; --danger:#FF8A80; --danger-soft:#3A1614;
  --board-bg:#080D0D; --board-fg:#E6EEEC; --board-muted:#9EAEAB; --board-card:#111A19; --frame:#33413F; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg:#0F1716; --bg-2:#141E1D; --ink:#E6EEEC; --muted:#9EAEAB; --line:#24302E; --line-strong:#64736F;
  --head:#0B2E2E; --on-head:#E6EEEC; --on-head-muted:#A8C3C1; --primary:#6CC8C2; --on-primary:#062020; --primary-soft:#15302E;
  --mark:#F2C94C; --on-mark:#14201F; --danger:#FF8A80; --danger-soft:#3A1614;
  --board-bg:#080D0D; --board-fg:#E6EEEC; --board-muted:#9EAEAB; --board-card:#111A19; --frame:#33413F; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--board-bg); color: var(--board-fg); font: 16px/1.45 var(--text); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 80px; }
::selection { background: var(--mark); color: var(--on-mark); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
button { font: inherit; color: inherit; }

/* board chrome */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--board-bg); border-bottom: 1px solid var(--line); padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 51; background: var(--board-bg); }
.top h1 { margin: 0; font-size: 21px; font-weight: 700; }
.top p { margin: 0; color: var(--board-muted); font-size: 14px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 8px; background: var(--board-card); border: 1px solid var(--line); }
.seg button { min-height: 38px; padding: 0 14px; border: 0; border-radius: 6px; background: none; color: var(--board-muted); cursor: pointer; font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--board-fg); color: var(--board-bg); font-weight: 600; }
.intro { max-width: 74ch; color: var(--board-muted); margin: 18px 0 0; }
.intro b { color: var(--board-fg); font-weight: 600; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 0 0; padding: 0; list-style: none; font-size: 15px; }
.toc a { color: var(--board-fg); text-underline-offset: 3px; }
section.grp { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); scroll-margin-top: 110px; }
section.grp > h2 { margin: 0; font-size: 20px; font-weight: 700; }
section.grp > p { margin: 4px 0 0; color: var(--board-muted); max-width: 74ch; font-size: 15px; }
.plates { display: flex; flex-wrap: wrap; gap: 36px 32px; margin-top: 20px; align-items: flex-start; }
.plate { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; max-width: 100%; }
.plate figcaption { font-size: 14px; color: var(--board-muted); max-width: 390px; }
.plate figcaption b { display: block; color: var(--board-fg); font-size: 16px; font-weight: 600; }
.tid { font-weight: 600; color: var(--primary); }
.fitbox { width: 100%; max-width: 100%; overflow: hidden; }
.dev { border: 8px solid var(--frame); background: var(--bg); color: var(--ink); overflow: hidden; position: relative; font-family: var(--text); }
.dev.phone { width: 390px; border-radius: 44px; }
.dev.tablet { width: 820px; border-radius: 28px; }
.dev.desktop { width: 1296px; border-radius: 14px; }
.wide-plate { width: 100%; }

/* ===== app components (system.md v3) ===== */
.scr { min-height: 800px; display: flex; flex-direction: column; position: relative; font-size: 16px; line-height: 1.4; }
.tablet .scr { min-height: 1024px; }
.desktop .scr { min-height: 780px; }
.fig { font-family: var(--fig); font-variant-numeric: tabular-nums; }
.appbar { background: var(--head); color: var(--on-head); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
.appbar .r1 { display: flex; align-items: center; gap: 6px; min-height: 44px; }
.appbar .r2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.appbar h3 { margin: 0; flex: 1; min-width: 0; font-size: 22px; font-weight: 700; line-height: 1.2; }
.ab-icon { width: 44px; height: 44px; margin-left: -10px; border: 0; background: none; color: var(--on-head); display: grid; place-items: center; }
.appbar .s { font-size: 14px; color: var(--on-head-muted); }
.ab-btn { min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--on-head-muted); background: transparent; color: var(--on-head); font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.ab-btn svg { width: 18px; height: 18px; }
.ab-lang { min-height: 40px; min-width: 44px; padding: 0 6px; border: 0; background: none; color: var(--on-head); font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }
.ab-av { width: 40px; height: 40px; border-radius: 999px; border: 1.5px solid var(--on-head-muted); background: none; color: var(--on-head); font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
.ab-right { display: flex; gap: 6px; align-items: center; }
/* the current class: full-width band */
.now { background: var(--primary-soft); padding: 14px 16px 16px; border-bottom: 1px solid var(--line); }
.now .k { font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.now .k b { color: var(--primary); font-weight: 600; }
.now .room { margin-top: 2px; font-family: var(--fig); font-weight: 700; font-size: 44px; line-height: 1.05; letter-spacing: -0.01em; }
.now .cls { font-weight: 600; font-size: 17px; }
.now .meta { font-size: 14px; color: var(--muted); }
.now .chg { margin-top: 8px; font-size: 14px; }
.mk { background: var(--mark); color: var(--on-mark); padding: 0 .18em; border-radius: 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.old { text-decoration: line-through; color: var(--muted); }
.sechead { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 16px 6px; }
.sechead h4 { margin: 0; font-size: 15px; font-weight: 700; color: var(--muted); }
.sechead a { font-size: 15px; font-weight: 600; color: var(--primary); text-decoration: none; min-height: 44px; display: inline-flex; align-items: center; }
/* timetable rows */
.tt { border-top: 1px solid var(--line); }
.tr { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: start; }
.tr .t { font-family: var(--fig); font-weight: 600; font-size: 18px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.tr .t small { display: block; font-size: 15px; font-weight: 500; color: var(--muted); }
.tr .t .dur { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; color: var(--muted); }
.tr .c { min-width: 0; }
.tr .c b { display: block; font-weight: 600; font-size: 16px; line-height: 1.3; }
.tr .c .m { font-size: 14px; color: var(--muted); }
.tr .c .m .fig { font-size: 15px; }
.tr .st { font-size: 14px; font-weight: 600; text-align: right; white-space: nowrap; padding-top: 1px; }
.tr .st.next { color: var(--primary); }
.tr .st.off { color: var(--danger); display: inline-flex; align-items: center; gap: 4px; }
.tr .st svg { width: 14px; height: 14px; }
.tr.past .t, .tr.past b, .tr.past .t small { color: var(--muted); font-weight: 500; }
.tr.cur { background: var(--primary-soft); }
.tr.off b { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.tr .why { font-size: 14px; font-weight: 600; color: var(--danger); }
.tr .note { font-size: 14px; color: var(--muted); margin-top: 1px; }
.gap { padding: 6px 16px 6px 80px; font-size: 14px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--bg-2); }
/* deadline rows */
.dr { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 0 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: start; color: inherit; text-decoration: none; }
.dr .cd { font-family: var(--fig); font-weight: 700; font-size: 18px; line-height: 1.15; font-variant-numeric: tabular-nums; }
.dr .cd small { display: block; font-size: 14px; font-weight: 500; color: var(--muted); }
.dr .cd.late { color: var(--danger); }
.dr .cd.soon { color: var(--ink); }
.dr .cd.far { color: var(--muted); font-weight: 600; }
.dr b { display: block; font-weight: 600; line-height: 1.3; }
.dr .m { font-size: 14px; color: var(--muted); }
/* bottom nav */
.bnav { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: var(--bg); padding-bottom: 10px; }
.bnav > span { min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: var(--muted); position: relative; }
.bnav > span.on { color: var(--primary); font-weight: 700; }
.bnav svg { width: 24px; height: 24px; }
.bnav .n { position: absolute; top: 6px; left: calc(50% + 6px); font-family: var(--fig); font-size: 12px; font-weight: 700; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--danger); color: var(--bg); display: grid; place-items: center; }
svg.i { width: 22px; height: 22px; flex-shrink: 0; }

/* forms, sheets, misc */
.pad { padding: 16px; }
.h2 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.25; }
.lead { margin: 6px 0 0; color: var(--muted); }
.btn { min-height: 52px; width: 100%; border: 0; border-radius: 10px; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0 18px; }
.btn.auto { width: auto; min-height: 44px; font-size: 15px; padding: 0 14px; }
.btn2 { min-height: 48px; width: 100%; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--bg); color: var(--ink); font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.tbtn { min-height: 44px; border: 0; background: none; color: var(--primary); font-weight: 600; font-size: 15px; padding: 0; display: inline-flex; align-items: center; gap: 6px; }
.tbtn.danger { color: var(--danger); }
.tbtn svg { width: 18px; height: 18px; }
.lab { display: block; margin: 0 0 6px; font-size: 15px; font-weight: 600; }
.input { min-height: 48px; width: 100%; border-radius: 8px; border: 1.5px solid var(--line-strong); background: var(--bg); color: var(--ink); padding: 10px 12px; font: 400 16px var(--text); }
.input.big { font-family: var(--fig); font-size: 24px; font-weight: 700; }
textarea.input { resize: none; }
.hint { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
.field + .field { margin-top: 18px; }
.segc { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1.5px solid var(--line-strong); border-radius: 10px; overflow: hidden; }
.segc > span { min-height: 48px; display: grid; place-items: center; font-weight: 600; border-left: 1.5px solid var(--line-strong); padding: 0 8px; text-align: center; }
.segc > span:first-child { border-left: 0; }
.segc > span.on { background: var(--ink); color: var(--bg); }
.radios { border-top: 1px solid var(--line); }
.radios > div { min-height: 52px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.rd { width: 20px; height: 20px; border-radius: 999px; border: 2px solid var(--line-strong); flex-shrink: 0; }
.rd.on { border: 6px solid var(--primary); }
.cb { width: 20px; height: 20px; border-radius: 4px; border: 2px solid var(--line-strong); flex-shrink: 0; display: grid; place-items: center; }
.cb.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.cb svg { width: 14px; height: 14px; }
.grouph { padding: 14px 16px 4px; font-weight: 700; }
.grouph span { font-weight: 400; color: var(--muted); }
.sticky { margin-top: auto; padding: 12px 16px 20px; border-top: 1px solid var(--line); background: var(--bg); display: flex; flex-direction: column; gap: 8px; }
.scrim { position: absolute; inset: 0; background: rgb(0 0 0 / .45); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 14px 14px 0 0; padding: 8px 16px 20px; box-shadow: 0 -8px 24px rgb(0 0 0 / .25); }
.grab { width: 36px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 10px; opacity: .6; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.sheet-h h4 { margin: 0; font-size: 20px; font-weight: 700; }
.x { width: 44px; height: 44px; margin-right: -10px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; }
.x svg { width: 20px; height: 20px; }
.notice { margin: 12px 16px 0; border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px; font-size: 15px; display: grid; grid-template-columns: 1fr auto; gap: 8px 4px; align-items: start; }
.notice .acts { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; }
.kv { border-top: 1px solid var(--line); }
.kv > div { min-height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.kv .v { color: var(--muted); font-size: 15px; }
.upd { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
.upd .kind { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.upd .kind.off { color: var(--danger); }
.upd .kind svg { width: 14px; height: 14px; }
.upd .when { font-size: 14px; color: var(--muted); text-align: right; white-space: nowrap; }
.upd .what { grid-column: 1 / -1; }
.upd .what b { font-weight: 600; }
.upd .note { grid-column: 1 / -1; font-size: 15px; color: var(--ink); }
.upd .who { grid-column: 1 / -1; font-size: 14px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.upd .who svg { width: 14px; height: 14px; color: var(--primary); }
.upd.new { background: var(--bg-2); }
.upd .newdot { font-size: 13px; font-weight: 700; color: var(--primary); }
.tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 16px; gap: 20px; }
.tabs > span { min-height: 44px; display: inline-flex; align-items: center; font-weight: 600; color: var(--muted); border-bottom: 2.5px solid transparent; }
.tabs > span.on { color: var(--ink); border-bottom-color: var(--primary); }
.grp-h { padding: 14px 16px 6px; font-size: 15px; font-weight: 700; color: var(--muted); border-bottom: 1px solid var(--line); }
.due-big { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; align-items: baseline; }
.due-big .n { font-family: var(--fig); font-weight: 700; font-size: 34px; line-height: 1; grid-row: span 2; }
.prose { padding: 0 16px; }
.prose p { margin: 0 0 10px; max-width: 62ch; }
.links a { display: flex; align-items: center; gap: 10px; min-height: 52px; border-bottom: 1px solid var(--line); color: var(--primary); text-decoration: none; word-break: break-all; font-weight: 500; }
.links svg { width: 18px; height: 18px; flex-shrink: 0; }
.lock { min-height: 800px; background: #10302F; color: #EEF5F4; padding: 56px 12px 20px; display: flex; flex-direction: column; gap: 8px; font-family: var(--text); }
.lock .clock { text-align: center; font-family: var(--fig); font-size: 80px; font-weight: 600; line-height: 1; }
.lock .date { text-align: center; color: #B9D3D1; margin-bottom: 26px; }
.notif { background: rgb(244 248 247 / .96); color: #14201F; border-radius: 16px; padding: 10px 12px; display: grid; grid-template-columns: 34px 1fr; gap: 0 10px; }
.notif .ai { width: 34px; height: 34px; border-radius: 8px; background: #0E5A5B; color: #fff; display: grid; place-items: center; font-family: var(--fig); font-weight: 700; font-size: 13px; grid-row: span 3; }
.notif .meta { display: flex; justify-content: space-between; font-size: 12px; color: #52605E; }
.notif .t { font-weight: 700; font-size: 15px; }
.notif .b { font-size: 15px; }
.wordmark { font-family: var(--fig); font-weight: 700; font-size: 22px; letter-spacing: .01em; }
.steps { margin: 6px 0 16px; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
.glyph { display: inline-grid; place-items: center; width: 26px; height: 26px; border: 1px solid var(--line-strong); border-radius: 6px; vertical-align: middle; margin-left: 2px; color: var(--primary); }
.glyph svg { width: 16px; height: 16px; }
.shot { border: 6px solid var(--frame); border-radius: 30px; overflow: hidden; width: 260px; flex-shrink: 0; background: var(--bg); }
.shot .inner { zoom: .666; width: 390px; pointer-events: none; }
.shot .inner .scr { min-height: 0; }
/* tablet + desktop shells */
.split { display: grid; flex: 1; min-height: 0; }
.rail { background: var(--head); color: var(--on-head); display: flex; flex-direction: column; gap: 4px; padding: 14px 10px; }
.rail .wordmark { color: var(--on-head); padding: 4px 8px 14px; }
.rail a { min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; color: var(--on-head-muted); text-decoration: none; font-weight: 600; position: relative; }
.rail a.on { background: rgb(255 255 255 / .12); color: var(--on-head); }
.rail a svg { width: 22px; height: 22px; }
.rail a .n { margin-left: auto; font-family: var(--fig); font-size: 13px; font-weight: 700; background: var(--danger); color: var(--bg); border-radius: 9px; padding: 0 6px; }
.rail .foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 8px; font-size: 14px; color: var(--on-head-muted); }
.rail .ab-btn { justify-content: center; }
.rail.icons a span.lbl { display: none; }
.rail.icons a { justify-content: center; padding: 0; }
.pane { border-left: 1px solid var(--line); min-width: 0; display: flex; flex-direction: column; }
.pane:first-child { border-left: 0; }
.panehead { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.panehead h4 { margin: 0; font-size: 18px; font-weight: 700; }
.panehead .s { color: var(--muted); font-size: 14px; }
.sel { background: var(--primary-soft) !important; }
/* week grid */
.week { display: grid; grid-template-columns: 52px repeat(5, minmax(0, 1fr)); position: relative; }
.week .hd { padding: 10px 8px 8px; border-bottom: 1px solid var(--line); border-left: 1px solid var(--line); font-weight: 600; font-size: 15px; }
.week .hd .fig { font-size: 20px; margin-right: 4px; }
.week .hd.today { color: var(--primary); }
.week .hd.today .fig { background: var(--primary); color: var(--on-primary); border-radius: 6px; padding: 0 6px; }
.week .gut { position: relative; }
.week .gut span { position: absolute; right: 8px; font-family: var(--fig); font-size: 13px; color: var(--muted); transform: translateY(-50%); }
.week .col { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% 52px; }
.week .col.today { background-color: color-mix(in srgb, var(--primary-soft) 55%, transparent); }
.blk { position: absolute; left: 4px; right: 4px; border-radius: 6px; padding: 4px 7px; font-size: 13px; line-height: 1.25; overflow: hidden; background: var(--bg-2); border: 1px solid var(--line-strong); }
.blk b { display: block; font-size: 14px; font-weight: 600; }
.blk .fig { font-size: 13px; }
.blk.lecture { background: var(--primary-soft); border-color: color-mix(in srgb, var(--primary) 45%, transparent); }
.blk.off { background: repeating-linear-gradient(135deg, var(--danger-soft) 0 6px, var(--bg) 6px 12px); border-color: var(--danger); color: var(--muted); }

.blk.past { opacity: 1; background: var(--bg); color: var(--muted); }
.nowline { position: absolute; left: 0; right: 0; height: 2px; background: var(--danger); z-index: 2; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 999px; background: var(--danger); }
/* landing + changelog */
.land { flex: 1; display: flex; flex-direction: column; }
.land-top { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--line); }

.land-main h3 { margin: 0; font-size: 28px; line-height: 1.2; font-weight: 700; text-wrap: balance; }
.land-main p { margin: 0; color: var(--muted); font-size: 17px; max-width: 46ch; }
.land-foot { margin-top: auto; padding: 14px 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.cl { padding: 8px 16px 24px; }
.cl h3 { margin: 18px 0 2px; font-size: 26px; font-weight: 700; }
.cl .rel { padding: 18px 0; border-bottom: 1px solid var(--line); }
.cl .rel h4 { margin: 0; font-size: 19px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.cl .rel h4 .fig { font-size: 22px; }
.cl .rel h4 span.d { font-size: 15px; font-weight: 400; color: var(--muted); }
.cl ul { margin: 8px 0 0; padding-left: 20px; max-width: 64ch; }
.cl li { margin: 4px 0; }
.cl .tag { font-size: 13px; font-weight: 700; color: var(--muted); }

@media (max-width: 600px) { .top { position: static; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  <div class="pane">${appbar(T("upd.title"), T("upd.sub"))}${UPD.map(updItem).join("")}</div>
  <div class="pane"><div class="panehead"><h4>${T("tab.today")}</h4></div><div class="tt">${DAY.classes.map((c) => row(c)).join("")}</div></div></div></div>`;
S.detailTablet = () => `<div class="scr"><div class="split" style="grid-template-columns:72px 340px 1fr">${rail("assign", true)}
  <div class="pane">${appbar(T("assign.title"), "", { report: T("assign.add") })}<div class="tabs"><span class="on">${T("assign.todo")} <span class="fig">5</span></span><span>${T("assign.done")} <span class="fig">3</span></span></div>${assignList("TKE-205today")}</div>
  <div class="pane">${detailBody()}</div></div></div>`;
const HOUR = 52, START = 7;
const yOf = (h) => (+h.slice(0, 2) + +h.slice(3) / 60 - START) * HOUR;
const blk = (b) => `<div class="blk ${b.off ? "off" : b.past ? "past" : b.t}" style="top:${yOf(b.s) + 1}px;height:${yOf(b.e) - yOf(b.s) - 2}px">
  <b>${b.n}</b><span class="fig">${b.s}–${b.e}</span> · ${b.off ? `<span class="why">${T("st.off")}</span>` : b.was ? `<span class="mk">${b.r}</span>` : b.r}</div>`;
const weekGrid = () => { const days = ["wk.mon","wk.tue","wk.wed","wk.thu","wk.fri"], dates = [23,24,25,26,27], H = HOUR * 10;
  return `<div class="week"><div class="hd" style="border-left:0"></div>${days.map((d, i) => `<div class="hd ${i === 2 ? "today" : ""}"><span class="fig">${dates[i]}</span>${T(d)}</div>`).join("")}
  <div class="gut" style="height:${H}px">${Array.from({ length: 10 }, (_, i) => i ? `<span style="top:${i * HOUR}px">${String(START + i).padStart(2, "0")}:00</span>` : "").join("")}</div>
  ${WEEK.map((list, i) => `<div class="col ${i === 2 ? "today" : ""}" style="height:${H}px">${list.map(blk).join("")}${i === 2 ? `<div class="nowline" style="top:${yOf("10:25")}px"></div>` : ""}</div>`).join("")}</div>`; };
S.todayDesk = () => `<div class="scr"><div class="split" style="grid-template-columns:220px 1fr 340px">${rail("today")}
  <div class="pane"><div class="panehead"><h4>${T("tab.week")}</h4><span class="s">${T("today.sum")}</span></div>${weekGrid()}</div>
  <div class="pane">${nowBand(DAY.classes[1])}<div class="panehead"><h4>${T("side.changes")}</h4></div>${UPD.slice(0, 3).map(updItem).join("")}
    <div class="panehead" style="border-top:1px solid var(--line);margin-top:8px"><h4>${T("side.due")}</h4><a class="tbtn" href="#assignments">${T("sec.all")}</a></div>${dueList(3)}</div></div></div>`;
S.updDesk = () => `<div class="scr"><div class="split" style="grid-template-columns:220px minmax(0,1fr) 380px">${rail("upd")}
  <div class="pane"><div class="panehead"><h4>${T("upd.title")}</h4><span class="s">${T("upd.sub")}</span></div><div style="max-width:720px">${UPD.map(updItem).join("")}</div></div>
  <div class="pane"><div class="panehead"><h4>${T("tab.today")}</h4></div><div class="tt">${DAY.classes.map((c) => row(c)).join("")}</div></div></div></div>`;
S.detailDesk = () => `<div class="scr"><div class="split" style="grid-template-columns:220px 400px minmax(0,1fr)">${rail("assign")}
  <div class="pane"><div class="panehead"><h4>${T("assign.title")}</h4><button class="tbtn">${ICON("i-plus")}${T("assign.add")}</button></div><div class="tabs"><span class="on">${T("assign.todo")} <span class="fig">5</span></span><span>${T("assign.done")} <span class="fig">3</span></span></div>${assignList("TKE-205today")}</div>
  <div class="pane"><div style="max-width:720px">${detailBody()}</div></div></div></div>`;

/* ---------- plates ---------- */
const P = (dev, render, tid, name, note) => ({ dev, render, tid, name, note });
const GROUPS = [
  { id:"today", h:"Today", p:"A real day at real density: timetable rows on a time gutter, durations, the free gap shown as a gap, the current class as a full-width band. Yellow highlight = changed, red = cancelled. Nothing else is coloured.",
    plates:[ P("phone","todayPhone","CO-11 · CO-24","Phone","10:25 WIB. One moved room, one cancelled lab, a 90-minute gap."),
             P("tablet","todayTablet","CO-11","Tablet","Two panes: today's timetable, and this week's changes with deadlines."),
             P("desktop","todayDesk","CO-11","Desktop","Week timetable (block height = duration, red line = now) with the current class, changes and deadlines beside it.") ] },
  { id:"updates", h:"Updates", p:"Every change in one plain list: what, which session, the old and new room, the rep's own words, and who posted it.",
    plates:[ P("phone","updPhone","CO-21 · CO-22","Phone","Newest first; unread has a tinted row and the word New."), P("tablet","updTablet","CO-22","Tablet","Feed beside today's timetable."), P("desktop","updDesk","CO-22","Desktop","Feed at reading width, today beside it.") ] },
  { id:"report", h:"Report a change (class reps)", p:"Opened from the one Report change button in the app bar (same place on every screen). Two kinds only: cancelled or room moved.",
    plates:[ P("phone","reportPhone","CO-21 · CO-23","Phone sheet","Class and session pre-filled from Today; tap Room moved, type 305, send.") ] },
  { id:"assignments", h:"Assignments", p:"Create and delete only. Countdown in the time gutter, the same rows as Today.",
    plates:[ P("phone","assignPhone","CO-15 · CO-16","List · phone","Grouped by when it is due."), P("phone","detailPhone","CO-15 · CO-16","Detail · phone","Same blocks for every assignment. Delete is for the class's editors."),
             P("phone","newPhone","CO-15 · CO-17","New assignment · phone","Due picked in one tap, read back in WIB."),
             P("tablet","detailTablet","CO-16","Detail · tablet","List and detail side by side."), P("desktop","detailDesk","CO-16","Detail · desktop","List, detail at reading width.") ] },
  { id:"start", h:"Sign in and onboarding", p:"Plain and short. No illustration, no tagline.",
    plates:[ P("phone","login","CO-08 · CO-09","Login",""), P("phone","onbLang","CO-10","Onboarding 1",""), P("phone","onbClasses","CO-10","Onboarding 2","Sections listed with their meeting times."), P("phone","onbRemind","CO-10 · CO-26","Onboarding 3","Shows the actual notification before asking. On iPhone Safari this step shows the Home Screen steps instead; never skipped.") ] },
  { id:"account", h:"Account, reminders, iPhone, push", p:"",
    plates:[ P("phone","accountPhone","CO-09 · CO-10","Account sheet","Change classes, language, reminders, sign out. Opens from the initial in the app bar."),
             P("phone","remindPhone","CO-26","Reminders off","A plain notice under the app bar for students who chose Not now."),
             P("phone","iosPhone","CO-28","iPhone hint","Only in iPhone Safari when CampusOS isn't on the Home Screen."),
             P("phone","pushPhone","CO-20 · CO-25","Push","The same three events as Today, as the phone shows them at 10:41.") ] },
  { id:"landing", h:"Landing page", p:"One screen: name, one line, a real screenshot of Today, sign in, changelog link. The Developer uses an actual screenshot of the built Today, not this mock.",
    plates:[ P("phone","landingPhone","Landing","Phone",""), P("desktop","landingDesk","Landing","Desktop","") ] },
  { id:"changelog", h:"Changelog", p:"A reading page: one column at 65 characters, releases newest first.",
    plates:[ P("phone","changelogPhone","Changelog","Phone",""), P("desktop","changelogDesk","Changelog","Desktop","") ] }
];

function build() {
  const board = document.getElementById("board");
  board.innerHTML = `
    <p class="intro">Every plate shows the same day: <b>Wednesday 25 November 2026, 10:25 WIB</b>, seen by Siti Rahma (TKE, class rep of TKE-205). Struktur Data moved from Ruang 204 to 305 at 07:58; the 13:30 lab was cancelled at 09:47. Course names and the reps' notes stay as written (Indonesian). <b>All Indonesian interface text is a draft for Alfiz/Siam to proofread.</b></p>
    <ul class="toc">${GROUPS.map((g) => `<li><a href="#${g.id}">${g.h}</a></li>`).join("")}</ul>
    ${GROUPS.map((g) => `<section class="grp" id="${g.id}"><h2>${g.h}</h2><p>${g.p}</p><div class="plates">${g.plates.map((p) => `
      <figure class="plate ${p.dev !== "phone" ? "wide-plate" : ""}"><figcaption><span class="tid">${p.tid}</span><b>${p.name}</b>${p.note}</figcaption>
        <div class="fitbox"><div class="dev ${p.dev}" data-dev="${p.dev}" lang="${LANG}">${S[p.render]()}</div></div></figure>`).join("")}</div></section>`).join("")}`;
  fit();
}
function fit() {
  document.querySelectorAll(".fitbox").forEach((box) => {
    const d = box.firstElementChild; d.style.zoom = 1;
    const z = Math.min(1, box.clientWidth / d.offsetWidth);
    d.style.zoom = z;
  });
}
function setLang(l) { LANG = l; document.querySelectorAll("[data-lang-btn]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.langBtn === l))); try { localStorage.setItem("v3-lang", l); } catch {} build(); }
function setTheme(t) { if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = t; document.querySelectorAll("[data-theme-btn]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === t))); try { localStorage.setItem("v3-theme", t); } catch {} }
document.querySelectorAll("[data-lang-btn]").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.langBtn)));
document.querySelectorAll("[data-theme-btn]").forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.themeBtn)));
addEventListener("resize", fit);
let l = "en", t = "system";
try { l = localStorage.getItem("v3-lang") || "en"; t = localStorage.getItem("v3-theme") || "system"; } catch {}
setTheme(["light", "dark"].includes(t) ? t : "system");
setLang(l === "id" ? "id" : "en");
document.fonts && document.fonts.ready.then(fit);
})();
</script>
